# The metanorma-ieee CitationStyle instance: the canonical IEEE-SA
# pack with the IEEE name-and-date deltas - the inverted first
# creator, the direct subsequent creators joined with "and", the
# batch-disambiguated date, and the standards cited by title alone.
name: "ISO 690 (metanorma-ieee flavour)"
family: ieee-sa
extends: ieee-sa
scheme:
  system: name-date
  defaultKind: online
  homeDocidType: []
  nameForm:
    initials: true
    initialsSeparator: ". "
    initialsPeriod: true
    invertedAll: false
    surnameUpcase: false
    completenameUpcase: false
    orgUpcase: false
    subsequentSurnameUpcase: false
    etalCount: 6
    etalDisplay: 3
    # The in-text cite truncates at its own threshold: IEEE cites
    # three or more creators as "Aluffi et al." while listing six in
    # the bibliography
    inTextEtalCount: 3
    inTextEtalDisplay: 1
    editorsMarked: false
    listStyle: serial
  locale:
    labels:
      "and": "and"
      oxford_comma: ","
      available_from: ""
      viewed: "accessed"
      no_place: "n.p."
      edition: "edition"
      edition_1: "first edition"
      edition_2: "second edition"
      edition_3: "third edition"
      edition_4: "fourth edition"
      edition_5: "fifth edition"
      edition_6: "sixth edition"
      edition_7: "seventh edition"
      edition_8: "eighth edition"
      edition_9: "ninth edition"
      edition_10: "tenth edition"
rules:
  identifier: ieee_identifier
  component_part: ieee_component_part
  access: ieee_access
  medium: ieee_medium
templates:
  titleOpen: "<em>"
  titleClose: "</em>"
  identifierMode: first
  citation: "{{surname}} {{disambiguateddate}}"
  reference: "{{creator}}, {{title}}, {{edition}}, {{production}}, {{disambiguateddate}}, {{identifier}}."
  name: "{{surname}}, {{givenNames}}"
  uri: "<fmt-link target='{{uri}}'>{{uri}}</fmt-link>"
perType:
  # home standards cite the plain title alone
  - type: report
    home: true
    template: "{{title}}."
    title: "{{title}}"
  - type: report
    template: "{{title}}, {{location}}."
    title: "{{title}}"
  - type: monograph
    template: "{{creator}}, {{title}}, {{edition}}, {{production}}, {{disambiguateddate}}, {{identifier}}."
  - type: component_part
    template: "{{creator}}, {{title}} {{componentpart}}, {{disambiguateddate}}, {{extent}}, {{access}}."
    title: "&#x201C;{{title}},&#x201D;"
  - type: continuing
    template: "{{title}}, {{date}}."
  - type: serial_part
    template: "{{creator}}, {{title}} {{series}}, {{extent}}, {{disambiguateddate}}, {{identifier}}."
    title: "&#x201C;{{title}},&#x201D;"
    series: "<em><em>{{series_title}}</em> ({{series_run}})</em>"
  - type: online
    template: "{{creator}}, {{title}} {{medium}} {{date}}{{disambiguator}}, {{access}}, {{location}}."
    title: "&#x201C;{{title}},&#x201D;"
  - type: webdoc
    template: "{{creator}}, {{title}} {{production}}, {{disambiguateddate}}, {{access}}, {{location}}."
    title: "&#x201C;{{title}},&#x201D;"
